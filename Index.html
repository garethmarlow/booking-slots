<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root {
      --ink: #1a1a1a;
      --muted: #6b6b6b;
      --line: #e3e3e3;
      --accent: #2a5db0;
      --accent-ink: #ffffff;
      --bg: #ffffff;
      --panel: #f7f7f8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    .wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 16px 64px;
    }
    .logo { display: block; height: 34px; width: auto; margin: 0 0 24px; }
    .hero { margin-bottom: 28px; }
    h1 {
      font-size: 26px;
      letter-spacing: -0.01em;
      margin: 0 0 6px;
    }
    .desc {
      font-size: 16px;
      margin: 0 0 6px;
      color: #3d3d3d;
    }
    .tz, .sub {
      color: var(--muted);
      font-size: 13px;
      margin: 0;
    }
    .day {
      margin-bottom: 24px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .day-label {
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 12px;
      color: var(--ink);
    }
    .loc-group + .loc-group { margin-top: 14px; }
    .loc-head {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .loc-head svg { flex: none; color: var(--accent); }
    .loc-head strong { color: var(--ink); font-weight: 600; }
    .slots {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
      gap: 8px;
    }
    button.slot {
      padding: 10px 8px;
      border: 1px solid #c9d6ee;
      border-radius: 10px;
      background: #f3f7fd;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      color: var(--accent);
      transition: background 0.12s, color 0.12s, border-color 0.12s;
    }
    button.slot:hover, button.slot:focus-visible {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
      outline: none;
    }
    .empty, .loading {
      color: var(--muted);
      font-size: 14px;
      padding: 24px 0;
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 360px;
    }
    .modal h2 { font-size: 16px; margin: 0 0 4px; }
    .modal .when { color: var(--muted); font-size: 14px; margin-bottom: 16px; }
    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin: 12px 0 4px;
    }
    input[type=text], input[type=email] {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 14px;
    }
    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 20px;
    }
    button.primary, button.secondary {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      border: 1px solid var(--line);
    }
    button.primary {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent);
    }
    button.primary:disabled { opacity: 0.6; cursor: default; }
    button.secondary { background: #fff; }
    .result {
      text-align: center;
      padding: 12px 0 0;
      font-size: 14px;
    }
    .error { color: #b3261e; font-size: 13px; margin-top: 8px; }
    .index-list a {
      display: block;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      margin-bottom: 8px;
      color: var(--ink);
      text-decoration: none;
    }
    .index-list a:hover { border-color: var(--accent); }
  </style>
</head>

  <? if (!type && !group) { ?>
    <header class="hero">
      <h1>Book a time</h1>
      <p class="desc">Book a call or meeting with <?= hostName ?>. Choose which you'd like:</p>
    </header>
    <div class="index-list">
      <? for (var i = 0; i < indexItems.length; i++) { ?>
        <a href="<?= baseUrl ?>?type=<?= indexItems[i].key ?>"><?= indexItems[i].label ?></a>
      <? } ?>
    </div>

  <? } else { ?>
    <header class="hero">
      <h1><?= pageTitle ?></h1>
      <p class="desc"><?= pageDescription ?></p>
      <p class="tz">Times shown in your local timezone.</p>
    </header>

    <div id="slotsRoot"><div class="loading">Loading available times…</div></div>

    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal">
        <h2>Confirm booking</h2>
        <div class="when" id="modalWhen"></div>
        <label for="nameInput">Name</label>
        <input type="text" id="nameInput" autocomplete="name">
        <label for="emailInput">Email</label>
        <input type="email" id="emailInput" autocomplete="email">
        <div class="error" id="modalError" style="display:none;"></div>
        <div class="modal-actions" id="confirmActions">
          <button class="secondary" id="cancelBtn">Cancel</button>
          <button class="primary" id="confirmBtn">Confirm</button>
        </div>
        <div class="result" id="modalResult" style="display:none;"></div>
        <div class="modal-actions" id="closeActions" style="display:none;">
          <button class="primary" id="closeBtn">Close</button>
        </div>
          </div>
    </div>

    <script>
      var TYPE_KEY = <?!= JSON.stringify(typeKey) ?>;
      var IS_GROUP = <?!= JSON.stringify(!!group) ?>;
      var selectedSlot = null;
      var PIN_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>';

      function fmtDayLabel(date) {
        return date.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
      }
      function fmtTime(date) {
        return date.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
      }
      function localDayKey(date) {
        // Group by the visitor's local calendar date.
        var y = date.getFullYear(), m = date.getMonth(), d = date.getDate();
        return y + '-' + m + '-' + d;
      }

      function renderSlots(slots) {
        var root = document.getElementById('slotsRoot');
        if (!slots.length) {
          root.innerHTML = '<div class="empty">No times currently available. Please check back later.</div>';
          return;
        }

        var byDay = {};
        var order = [];
        slots.forEach(function (s) {
          var start = new Date(s.startIso);
          var key = localDayKey(start);
          if (!byDay[key]) { byDay[key] = { label: fmtDayLabel(start), items: [] }; order.push(key); }
          byDay[key].items.push(s);
        });

        root.innerHTML = '';
        order.forEach(function (key) {
          var day = byDay[key];
          var dayEl = document.createElement('div');
          dayEl.className = 'day';
          var labelEl = document.createElement('div');
          labelEl.className = 'day-label';
          labelEl.textContent = day.label;
          dayEl.appendChild(labelEl);

          // Sub-group by location so the location is stated once above its buttons.
          var byLoc = {};
          var locOrder = [];
          day.items.forEach(function (s) {
            var lk = s.locationName || '';
            if (!byLoc[lk]) { byLoc[lk] = { address: s.location, items: [] }; locOrder.push(lk); }
            byLoc[lk].items.push(s);
          });

          locOrder.forEach(function (lk) {
            var groupEl = document.createElement('div');
            groupEl.className = 'loc-group';
            if (lk) {
              var headEl = document.createElement('div');
              headEl.className = 'loc-head';
              headEl.title = byLoc[lk].address || '';
              headEl.innerHTML = PIN_SVG;
              var nameEl = document.createElement('strong');
              nameEl.textContent = lk;
              headEl.appendChild(nameEl);
              groupEl.appendChild(headEl);
            }
            var slotsEl = document.createElement('div');
            slotsEl.className = 'slots';
            byLoc[lk].items.forEach(function (s) {
              var btn = document.createElement('button');
              btn.className = 'slot';
              btn.type = 'button';
              btn.textContent = fmtTime(new Date(s.startIso));
              btn.addEventListener('click', function () { openModal(s); });
              slotsEl.appendChild(btn);
            });
            groupEl.appendChild(slotsEl);
            dayEl.appendChild(groupEl);
          });
          root.appendChild(dayEl);
        });
      }

      function openModal(slot) {
        selectedSlot = slot;
        var start = new Date(slot.startIso);
        var when = fmtDayLabel(start) + ' at ' + fmtTime(start);
        if (slot.location) { when += ' — ' + slot.location; }
        document.getElementById('modalWhen').textContent = when;
        document.getElementById('nameInput').value = '';
        document.getElementById('emailInput').value = '';
        document.querySelector('.modal h2').style.display = 'block';
        document.getElementById('modalWhen').style.display = 'block';
        document.querySelectorAll('.modal label, .modal input').forEach(function (el) { el.style.display = 'block'; });
        document.getElementById('modalError').style.display = 'none';
        document.getElementById('modalResult').style.display = 'none';
        document.getElementById('confirmActions').style.display = 'flex';
        document.getElementById('cancelBtn').style.display = 'block';
        document.getElementById('closeActions').style.display = 'none';
        document.getElementById('confirmBtn').disabled = false;
        document.getElementById('confirmBtn').textContent = 'Confirm';
        document.getElementById('modalBackdrop').classList.add('open');
      }
      function closeModal() {
        document.getElementById('modalBackdrop').classList.remove('open');
      }

      document.getElementById('cancelBtn').addEventListener('click', closeModal);

      document.getElementById('closeBtn').addEventListener('click', function () {
        closeModal();
        loadSlots(); // refresh so the slot just booked disappears
      });

      document.getElementById('confirmBtn').addEventListener('click', function () {
        var name = document.getElementById('nameInput').value.trim();
        var email = document.getElementById('emailInput').value.trim();
        var errEl = document.getElementById('modalError');
        if (!name || !email) {
          errEl.textContent = 'Please fill in both name and email.';
          errEl.style.display = 'block';
          return;
        }
        errEl.style.display = 'none';

        var btn = document.getElementById('confirmBtn');
        btn.disabled = true;
        btn.textContent = 'Booking…';
        document.getElementById('cancelBtn').style.display = 'none';

        var bookingTypeKey = selectedSlot.typeKey || TYPE_KEY;

        google.script.run
          .withSuccessHandler(function (res) {
            if (res.ok) {
              document.querySelector('.modal h2').style.display = 'none';
              document.getElementById('modalWhen').style.display = 'none';
              document.querySelectorAll('.modal label, .modal input').forEach(function (el) { el.style.display = 'none'; });
              document.getElementById('confirmActions').style.display = 'none';
              var resultEl = document.getElementById('modalResult');
              resultEl.textContent = res.message;
              resultEl.style.display = 'block';
              document.getElementById('closeActions').style.display = 'flex';
            } else {
              errEl.textContent = res.message;
              errEl.style.display = 'block';
              btn.disabled = false;
              btn.textContent = 'Confirm';
              document.getElementById('cancelBtn').style.display = 'block';
            }
          })
          .withFailureHandler(function (err) {
            errEl.textContent = 'Something went wrong: ' + err.message;
            errEl.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Confirm';
            document.getElementById('cancelBtn').style.display = 'block';
          })
          .bookSlot(bookingTypeKey, selectedSlot.startIso, selectedSlot.endIso, name, email);
      });

      function loadSlots() {
        var call = google.script.run
          .withSuccessHandler(renderSlots)
          .withFailureHandler(function (err) {
            document.getElementById('slotsRoot').innerHTML =
              '<div class="empty">Couldn\'t load available times: ' + err.message + '</div>';
          });
        if (IS_GROUP) {
          call.getAvailableSlotsForGroup(TYPE_KEY);
        } else {
          call.getAvailableSlots(TYPE_KEY);
        }
      }
      loadSlots();
    </script>
  <? } ?>

</div>
